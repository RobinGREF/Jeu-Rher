<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeu des vacances</title>
<meta name="description" content="Mes jeux de vacances : 50 Missions, Famille Fight, Duel de savoir, Mémo des paires.">
<meta property="og:type" content="website">
<meta property="og:title" content="Jeu des vacances">
<meta property="og:description" content="Mes jeux de vacances : 50 Missions, Famille Fight, Duel de savoir, Mémo des paires.">
<meta property="og:image" content="https://robingref.github.io/Jeu-Rher/icons/hub-512.png">
<meta property="og:url" content="https://robingref.github.io/Jeu-Rher/">

<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/hub-192.png"><meta name="theme-color" content="#0f172a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%231e293b%27/%3E%3Ctext x=%2750%27 y=%2772%27 font-size=%2760%27 text-anchor=%27middle%27%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; --bg:#0f172a; --card:#1e293b; --fg:#f8fafc; --dim:#94a3b8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:16px 16px 28px; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:34px; margin:12px 0 4px; text-align:center; }
  .sub { text-align:center; color:var(--dim); margin:0 0 24px; }
  ul { list-style:none; margin:0 auto; padding:0; display:grid; grid-template-columns:repeat(2, 1fr); gap:18px 14px; max-width:420px; }
  .app { display:flex; flex-direction:column; align-items:center; gap:8px; text-decoration:none; color:inherit; position:relative; }
  a.app:active .icon, a.app:hover .icon { transform:scale(.96); }
  /* icône carrée, grande, qui garde ses proportions : 2 × 2 tiennent à l'écran */
  .icon { width:min(100%, 34vh, 190px); aspect-ratio:1; border-radius:22%; display:grid; place-items:center; font-size:min(18vw, 14vh, 84px); background:linear-gradient(145deg, var(--c), color-mix(in srgb, var(--c) 55%, #000)); box-shadow:0 4px 14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.3); transition:transform .1s; }
  .t { font-weight:700; font-size:16px; text-align:center; }
  .d, .btn { display:none; }
  .soon { opacity:.55; } .soon .icon { filter:grayscale(.7); }
  .soon .t::after { content:" · bientôt"; font-weight:400; color:var(--dim); font-size:13px; }
  footer { margin-top:28px; text-align:center; color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>🎲 Jeu des vacances</h1>
  <p class="sub">Mes jeux, au même endroit</p>
  <ul id="liste"><li class="d" style="text-align:center">Chargement…</li></ul>
  <footer>La liste s'allonge au fil des jeux.</footer>
</main>
<script>
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  fetch('games.json').then((r) => r.json()).then(({ games }) => {
    document.getElementById('liste').innerHTML = games.map((g) => {
      const c = /^#[0-9a-f]{3,8}$/i.test(g.couleur) ? g.couleur : '#64748b';
      const inner = `<span class="icon">${esc(g.emoji)}</span><span class="txt"><div class="t">${esc(g.titre)}</div><div class="d">${esc(g.description)}</div></span>`;
      return g.url
        ? `<li><a class="app" style="--c:${c}" href="${esc(g.url)}">${inner}<span class="btn">Jouer</span></a></li>`
        : `<li><div class="app soon" style="--c:${c}">${inner}<span class="btn">Bientôt</span></div></li>`;
    }).join('');
  }).catch(() => { document.getElementById('liste').innerHTML = '<li class="d" style="text-align:center">Liste indisponible.</li>'; });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
