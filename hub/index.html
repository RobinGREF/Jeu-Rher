<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeu Robin</title>
<style>
  :root { color-scheme: dark; --bg:#0f172a; --card:#1e293b; --fg:#f8fafc; --dim:#94a3b8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:24px 16px 40px; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:34px; margin:12px 0 4px; text-align:center; }
  .sub { text-align:center; color:var(--dim); margin:0 0 24px; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:12px; }
  a.game, .game.soon { display:flex; gap:14px; align-items:center; background:var(--card); border-radius:16px; padding:14px 16px; text-decoration:none; color:inherit; border-left:6px solid var(--c); }
  a.game:active, a.game:hover { filter:brightness(1.15); }
  .emoji { font-size:36px; }
  .t { font-weight:800; font-size:20px; }
  .d { color:var(--dim); font-size:14px; }
  .go { margin-left:auto; font-weight:800; color:var(--c); white-space:nowrap; }
  .soon { opacity:.55; }
  footer { margin-top:28px; text-align:center; color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>🎲 Jeu Robin</h1>
  <p class="sub">Mes jeux, au même endroit</p>
  <ul id="liste"><li class="d" style="text-align:center">Chargement…</li></ul>
  <footer>La liste s'allonge au fil des jeux.</footer>
</main>
<script>
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  fetch('games.json').then((r) => r.json()).then(({ games }) => {
    document.getElementById('liste').innerHTML = games.map((g) => {
      const c = /^#[0-9a-f]{3,8}$/i.test(g.couleur) ? g.couleur : '#64748b';
      const inner = `<span class="emoji">${esc(g.emoji)}</span><span><div class="t">${esc(g.titre)}</div><div class="d">${esc(g.description)}</div></span>`;
      return g.url
        ? `<li><a class="game" style="--c:${c}" href="${esc(g.url)}">${inner}<span class="go">Jouer ›</span></a></li>`
        : `<li><div class="game soon" style="--c:${c}">${inner}<span class="go">Bientôt</span></div></li>`;
    }).join('');
  }).catch(() => { document.getElementById('liste').innerHTML = '<li class="d" style="text-align:center">Liste indisponible.</li>'; });
</script>
</body>
</html>
