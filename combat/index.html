<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumble Fighter</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b12;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{background:#000;max-width:100vw;max-height:100vh;aspect-ratio:16/9;width:min(100vw,177.78vh);height:auto;image-rendering:auto;touch-action:none}
  #touch{display:none;position:fixed;left:0;right:0;bottom:0;height:0;pointer-events:none;z-index:5;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  body.touch[data-scene=fight] #touch{display:block}
  #touch{--s:min(66px,16vw,20vh);--g:6px;--b:14px}
  #touch button{position:fixed;pointer-events:auto;touch-action:none;border:2px solid rgba(255,255,255,.55);background:rgba(20,20,30,.45);color:#fff;font:bold clamp(10px,3vw,15px) Arial,sans-serif;border-radius:50%;width:var(--s);height:var(--s);padding:0;-webkit-tap-highlight-color:transparent}
  #touch button.on{background:rgba(255,210,63,.7);color:#000}
  #touch .dp{border-radius:14px}
  #tl{left:2vw;bottom:calc(var(--b) + var(--s) + var(--g))}
  #tr{left:calc(2vw + 2*var(--s) + 2*var(--g));bottom:calc(var(--b) + var(--s) + var(--g))}
  #tu{left:calc(2vw + var(--s) + var(--g));bottom:calc(var(--b) + 2*var(--s) + 2*var(--g))}
  #td{left:calc(2vw + var(--s) + var(--g));bottom:var(--b)}
  #tp{right:calc(2vw + var(--s) + var(--g));bottom:calc(var(--b) + var(--s)*0.4);background:rgba(214,58,47,.5)!important}
  #tk{right:2vw;bottom:calc(var(--b) + var(--s)*0.9 + var(--g));background:rgba(47,110,214,.5)!important}
  #ts{right:calc(2vw + var(--s)*0.5 + var(--g)/2);bottom:calc(var(--b) + var(--s)*2 + var(--g)*2);background:rgba(230,160,20,.55)!important}
  #refresh{position:fixed;left:8px;top:8px;z-index:6;width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(20,20,30,.45);color:#fff;font:bold 18px Arial,sans-serif;padding:0;opacity:.7;-webkit-tap-highlight-color:transparent}
  #tpause{right:8px;top:8px;width:40px!important;height:40px!important;font-size:14px!important}
  #codeIn{display:none;position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);width:min(260px,70vw);font:900 clamp(30px,8vw,48px) Impact,'Arial Black',sans-serif;letter-spacing:.3em;text-align:center;text-transform:uppercase;color:#ffd23f;background:rgba(0,0,0,.75);border:3px solid #ffd23f;border-radius:12px;padding:6px 0 6px .3em;outline:none;z-index:6}
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<!-- Personnalisation : voir js/data.js (personnages, décors, réglages) -->
<div id="touch">
  <button class="dp" id="tl" data-k="ArrowLeft">◀</button><button class="dp" id="tr" data-k="ArrowRight">▶</button>
  <button class="dp" id="tu" data-k="ArrowUp">▲</button><button class="dp" id="td" data-k="ArrowDown">▼</button>
  <button id="tp" data-a="KeyJ">POING</button><button id="tk" data-a="KeyK">PIED</button><button id="ts" data-a="KeyL">SPÉCIAL</button>
  <button id="tpause" data-a="KeyP">II</button>
</div>
<input id="codeIn" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Code du salon">
<button id="refresh" type="button" tabindex="-1" aria-label="Recharger la dernière version du jeu" title="Recharger la dernière version">↻</button>
<script>
  // Recharge en forçant la dernière version publiée (adresse différente à chaque fois : le navigateur ne réutilise pas sa copie).
  document.getElementById('refresh').addEventListener('click', function () {
    var u = new URL(location.href); u.searchParams.set('v', Date.now()); location.replace(u.toString());
  });
</script>
<script src="js/data.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/online.js"></script>
<script src="js/game.js"></script>
</body>
</html>
